name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start production stack
        run: docker compose up -d --build

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Verify HTTP assets
        run: |
          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:3000/)"
          echo "$headers"
          ! echo "$headers" | grep -qi 'upgrade-insecure-requests'
          ! echo "$headers" | grep -qi 'strict-transport-security'
          curl --fail --silent --show-error --head http://127.0.0.1:3000/assets/css/main.css |
            grep -qi 'content-type: text/css'

      - name: Verify site name and empty content
        run: |
          page="$(curl --fail --silent http://127.0.0.1:3000/)"
          echo "$page" | grep -q '晚安的博客'
          if echo "$page" | grep -q '把博客重新做成一块安静的自留地'; then
            echo 'Sample post is still present.'
            exit 1
          fi

      - name: Stop production stack
        if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max